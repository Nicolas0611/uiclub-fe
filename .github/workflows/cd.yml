name: CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm install

      - name: Run Linter
        run: npm run lint

      # ✅ Use production database URL from GitHub Secrets
      - name: Run Prisma Migrations (Production Safe)
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      # (Optional) Seed only if your seed script is safe for production
      # Otherwise remove this step
      #- name: Run Seed
      #  run: npm run seed
      #  env:
      #    DATABASE_URL: ${{ secrets.DATABASE_URL }}
      #    DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Debug - List project test files
        run: |
          echo "=== Searching for project test files ==="
          find src -type f \( -name "*.test.*" -o -name "*.spec.*" \)

      - name: Build Project
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Deploy to Vercel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx vercel@latest --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
